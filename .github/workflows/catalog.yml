name: Cập nhật catalog
on:
  workflow_dispatch:
  push:
    paths: ['rbz/**', 'icons/**', 'guides/**', 'tools/**', 'plugins.json', '.github/workflows/catalog.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_catalog.py
      - name: Commit catalog.json
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || (git commit -m "Cập nhật catalog" && git push)
